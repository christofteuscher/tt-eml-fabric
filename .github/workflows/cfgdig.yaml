# Harden the config block (cfgdig) with LibreLane.
#
# WHY THIS EXISTS.  cfgdig is a plain standard-cell macro -- a 64-bit scan
# chain plus decode -- and place-and-route is a solved problem for it.  It
# is hardened here rather than locally because the local toolchain cannot
# be completed: LibreLane needs OpenROAD, OpenROAD needs Nix, and Nix on
# macOS 26 needs an /etc/fstab entry that SIP refuses to create by any
# method (rename, vifs, tee, cp, or the real path behind the symlink).
# Ubuntu has none of those problems.
#
# It buys two things:
#   1. The 3 nets the hand router could not place (n0/n1/n3 in the mux
#      one-hot decode).  Those are OPENS -- observation channels would be
#      dead on silicon.
#   2. A choice of aspect ratio.  DIE_AREA is one line of config, and a
#      220 x 42 macro instead of 289.7 x 34.5 frees ~90 um in the die's
#      top band -- one of the three levers that could make a 3-cell
#      fabric fit.
#
# The GDS is published as an artifact; the analog top level consumes it.

name: cfgdig

on:
  push:
    paths:
      - "src/cfgdig.v"
      - "openlane/cfgdig/**"
      - ".github/workflows/cfgdig.yaml"
  workflow_dispatch:

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # LibreLane ships its whole tool closure (OpenROAD, Yosys built WITH
      # pyosys, KLayout, magic, netgen) through Nix.  Installing the tools
      # individually is what fails: a Homebrew yosys rejects `-y` because
      # it has no Python support, and version skew shows up one tool at a
      # time.  The closure pins them together.
      #
      # WHY THE SUBSTITUTER MATTERS.  Without it, `nix run` COMPILES the
      # closure from source on the runner -- and iverilog fails 1 of its
      # own 297 self-tests during that build, which aborts the whole
      # derivation ("1 dependency failed" on librelane-3.0.5.drv).  The
      # FOSSI Foundation cache is where LibreLane's own CI pulls the tools
      # as prebuilt binaries, so iverilog is fetched, never recompiled,
      # and the flaky test phase never runs.  (Locally, --dockerized does
      # the same thing: prebuilt tools, no from-source compile.)
      - name: install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=

      # Fetch the PDK.  This run is EXPECTED to fail: LibreLane downloads
      # every sky130 tarball, then validates the PDK config and quits,
      # because the hvl SCL config still references two openlane-era
      # exclude files -- no_synth.cells and drc_exclude.cells -- that
      # ciel's fresh fetch of the pinned rev omits.  The download half
      # completes regardless, leaving the full PDK tree on disk for the
      # repair step.  `|| true` swallows the anticipated PDK-load exit.
      - name: fetch the PDK (PDK-load failure here is expected)
        run: |
          nix run github:librelane/librelane/3.0.5 -- \
            --pdk-root "$HOME/.ciel" \
            --run-tag prefetch \
            openlane/cfgdig/config.json || true

      # Write the two files the fetched hvl library is missing.  The
      # validation that just failed checks the PDK's OWN declared paths,
      # which a design-config override cannot reach -- so the fix has to
      # land in the PDK tree itself.  Content is copied verbatim from the
      # rev the local --dockerized runs use (no_synth == synth_excluded;
      # drc_exclude is empty).  Both sky130A and sky130B are patched so
      # the flow is insensitive to which variant the config resolves.
      - name: repair hvl exclude lists in the fetched PDK
        run: |
          set -e
          patched=0
          for CFG in $(find "$HOME/.ciel" -type d -path "*libs.tech/openlane/sky130_fd_sc_hvl"); do
            cp openlane/cfgdig/synth_excluded.cells "$CFG/no_synth.cells"
            : > "$CFG/drc_exclude.cells"
            echo "patched $CFG"
            patched=$((patched+1))
          done
          # If the fetched tree lacks the dir entirely, construct it from
          # the version root so the PDK's declared path resolves.
          if [ "$patched" -eq 0 ]; then
            for VROOT in $(find "$HOME/.ciel" -type d -name versions); do
              for REV in "$VROOT"/*; do
                for VAR in sky130A sky130B; do
                  D="$REV/$VAR/libs.tech/openlane/sky130_fd_sc_hvl"
                  mkdir -p "$D"
                  cp openlane/cfgdig/synth_excluded.cells "$D/no_synth.cells"
                  : > "$D/drc_exclude.cells"
                  echo "created $D"
                  patched=$((patched+1))
                done
              done
            done
          fi
          test "$patched" -gt 0 || { echo "no PDK tree found to patch"; exit 1; }

      - name: harden cfgdig
        run: |
          nix run github:librelane/librelane/3.0.5 -- \
            --pdk-root "$HOME/.ciel" \
            --run-tag ci \
            openlane/cfgdig/config.json

      # Fail loudly on an unrouted net.  A macro that "completes" with
      # opens is worse than one that fails: LVS at the top level would
      # pass on the analog side and the dead channels would only show up
      # on silicon.
      - name: check routing completed
        run: |
          M=openlane/cfgdig/runs/ci/final/metrics.json
          test -f "$M" || { echo "no metrics.json -- flow did not finish"; exit 1; }
          python3 - "$M" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          bad = {k: v for k, v in m.items()
                 if ("antenna__violating" in k or "unconnected" in k
                     or k.endswith("__drc_errors") or "open" in k.lower())
                 and isinstance(v, (int, float)) and v > 0}
          for k, v in sorted(bad.items()):
              print(f"  {k} = {v}")
          sys.exit(1 if bad else 0)
          PY

      - name: publish the macro
        uses: actions/upload-artifact@v4
        with:
          name: cfgdig-gds
          path: |
            openlane/cfgdig/runs/ci/final/gds/*.gds
            openlane/cfgdig/runs/ci/final/lef/*.lef
            openlane/cfgdig/runs/ci/final/nl/*.nl.v
            openlane/cfgdig/runs/ci/final/metrics.json

      - name: report the shape actually achieved
        if: always()
        run: |
          M=openlane/cfgdig/runs/ci/final/metrics.json
          [ -f "$M" ] && python3 -c "
          import json;m=json.load(open('$M'))
          for k in sorted(m):
              if any(s in k for s in ('die__area','core__area','utilization',
                                      'wire_length','drc','antenna')):
                  print(f'  {k} = {m[k]}')" || true
